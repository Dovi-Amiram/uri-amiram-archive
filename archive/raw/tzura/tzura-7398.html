                    שִבחֵי  געגוע


                </h3>
<div class="post-content">
<div class="post-body">
<span style="direction: rtl; line-height: 30px; white-space: pre-line; font-size: larger">

                                 
 
 
 
אל נא נגשים חלום נפלא -
תנו לחלום אותו שנית.
תנו שוב לחיות מהתחלה
את הכמיהה הראשונית.

אל נא נגשים כל געגוע -
יש גם מיקסם בכיסופים.
תנו לספינה מרחב לנוע
טרם תבוא אל החופים.

כי צימאון - טהור ממים
וגעגוע - ממיפגש
תנו למצות אותם בינתיים
עד שיפציע יום חדש.
