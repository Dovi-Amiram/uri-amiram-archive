                    יריד הכזבים


                </h3>
<div class="post-content">
<div class="post-body">
<span style="direction: rtl; line-height: 30px; white-space: pre-line; font-size: larger">

                                 
 
 
ביריד הכזבים בקולנוע
מרצדים מסכי אשליות
לא תמצא כף רגלךְ שם מנוח
להשקיט את מוסר הכליות 


שם תמו הדין והחסד
ואין אפוטרופוס לחטא
רעבה כשועל את נכנסת
אל הכרם - וכך גם יוצאת 


אל תדמי בנפשך להימלט
אל בית-השקר מבית האמת
כי מיקסם-שווא נושף בעורפך
ואחת היא דתו - לכשפך




                            
                            </span>
