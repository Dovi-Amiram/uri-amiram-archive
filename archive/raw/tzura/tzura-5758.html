ובמותם
ציוו לנו את החיים
העשויים
טיפות שקופות של טל

בשתיקתם
ניגנו לנו את הצלילים
המשולים
למוות המוטל

מתוך האבנים
אשר אהב

ועוד סיוון ועוד תמוז
ואב

ואלולים
קצרים כל כך
ובהולים
וקשר השתיקה אשר לסתיו
