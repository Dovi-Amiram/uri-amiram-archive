<h3 class="title-bg">
                    חלונות מנופצים


                </h3>
<div class="post-content">
<div class="post-body">
<span style="direction: rtl; line-height: 30px; white-space: pre-line; font-size: larger">

                                כשאחזור מהרחוב
בו ינופצו החלונות
של אוטובוסים נושאי אבק, ואפר
שהובא זה מקרוב
מתוך המחנות
להיטמן באדמתי המשוספת

התחכי לי, להפחית
את הכאב המנוכר,
דואגת כמו תמיד ומתחשבת,
ללקוט שברי זכוכית
מתוך גופי המר
ולחבוש את הפצעים ביד אוהבת?



                            
                            </span>
